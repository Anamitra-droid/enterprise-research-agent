name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      SEARCH_PROVIDER: mock
      EMBEDDING_PROVIDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (without local-embedding extras – tests use hashing embeddings)
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Unit + integration tests
        run: uv run pytest --cov=research_agent --cov-report=term-missing
      - name: Retrieval + routing eval (smoke)
        run: uv run python -m research_agent.evaluation --skip-answers
