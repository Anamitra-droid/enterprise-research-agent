services:
  api:
    build: .
    image: enterprise-research-agent:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LOG_JSON: "true"
      # persist conversations, approvals and metrics across restarts
      SQLITE_PATH: /app/var/db/app.db
      CHECKPOINT_PATH: /app/var/db/checkpoints.db
    volumes:
      - agent-db:/app/var/db

volumes:
  agent-db:
